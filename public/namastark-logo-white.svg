<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@500;600&amp;display=swap');
      .logo-title-w {
        font-family: 'Montserrat', 'Century Gothic', 'Futura', 'Avenir', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: 16px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .logo-sub-w {
        font-family: 'Montserrat', 'Century Gothic', 'Futura', 'Avenir', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 9.5px;
        fill: #f1f5f9;
        text-anchor: middle;
      }
    </style>
  </defs>
  <!-- Main Title: NAMASTARK -->
  <text x="258" y="60" class="logo-title-w">NAMASTARK</text>
  <!-- Subtitle: DIGITAL MARKETING -->
  <text x="255" y="102" class="logo-sub-w">DIGITAL MARKETING</text>
</svg>
