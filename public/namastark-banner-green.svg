<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800;900&amp;display=swap');
      .banner-title {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 68px;
        letter-spacing: 26px;
        fill: #0a0e0a;
        stroke: #ffffff;
        stroke-width: 2px;
        paint-order: stroke fill;
        text-anchor: middle;
      }
      .banner-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 26px;
        letter-spacing: 16px;
        fill: #ffffff;
        text-anchor: middle;
      }
    </style>
    <!-- Pixel Camouflage pattern inspired by the second uploaded banner -->
    <pattern id="pixelGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3f5a36"/>
      <rect x="20" width="20" height="20" fill="#4d6b42"/>
      <rect y="20" width="20" height="20" fill="#354c2d"/>
      <rect x="20" y="20" width="20" height="20" fill="#425c38"/>
      <rect x="5" y="5" width="10" height="10" fill="#2d4026" opacity="0.6"/>
      <rect x="25" y="25" width="10" height="10" fill="#587c4d" opacity="0.5"/>
      <rect x="25" y="5" width="10" height="10" fill="#314629" opacity="0.7"/>
      <rect x="5" y="25" width="10" height="10" fill="#507044" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="200" rx="12" fill="#3b5233"/>
  <rect width="800" height="200" rx="12" fill="url(#pixelGrid)" opacity="0.85"/>
  <text x="413" y="100" class="banner-title">NAMASTARK</text>
  <text x="408" y="160" class="banner-sub">DIGITAL MARKETING</text>
</svg>
